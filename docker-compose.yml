services:
  postgres:
    image: postgres:16-alpine
    container_name: atomquest-postgres
    environment:
      POSTGRES_DB: atomquest
      POSTGRES_USER: atomquest
      POSTGRES_PASSWORD: atomquest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atomquest -d atomquest"]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:latest
    container_name: atomquest-livekit
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

volumes:
  postgres_data:
